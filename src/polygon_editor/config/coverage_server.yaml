coverage_server:
  ros__parameters:
    coordinates_in_cartesian_frame: true
    robot_width: 0.6
    operation_width: 0.6
    min_turning_radius: 0.3
    linear_curv_change: 150.0
    default_allow_overlap: false
    default_headland_width: 0.45
    default_headland_type: "CONSTANT"
    default_path_type:  "DUBIN" #"REEDS_SHEPP" 
    default_path_continuity_type: "CONTINUOUS"
    default_turn_point_distance: 0.1
    default_route_type: "BOUSTROPHEDON"
    default_swath_type: "LENGTH"
    default_swath_angle_type: "SET_ANGLE"  #"BRUTE_FORCE" 
    default_swath_angle: 1.57 #0.17
    default_step_angle: 0.0
    action_server_result_timeout: 20.0